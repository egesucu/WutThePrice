name: WTP
options:
  bundleIdPrefix: tr.com.egesucu
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1'
    DEVELOPMENT_TEAM: RKA7R98LN8
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: '1.0'
targets:
  WTP:
    type: application
    platform: iOS
    sources: [WTP, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tr.com.egesucu.wuttheprice
        INFOPLIST_KEY_CFBundleDisplayName: Euro in Lira
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    entitlements:
      path: WTP/WTP.entitlements
      properties:
        com.apple.security.application-groups: [group.tr.com.egesucu.wuttheprice]
    dependencies:
      - target: CurrencyWidget
  CurrencyWidget:
    type: app-extension
    platform: iOS
    sources: [CurrencyWidget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tr.com.egesucu.wuttheprice.widget
        SKIP_INSTALL: YES
    info:
      path: CurrencyWidget/Info.plist
      properties:
        CFBundleDisplayName: Euro in Lira
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: CurrencyWidget/CurrencyWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.tr.com.egesucu.wuttheprice]
